<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
  <title>Double fertilization in the typical diploid angiosperm</title>
  <rect width="640" height="280" fill="#f7f5ed"/>
  <g fill="#1b3843" font-family="system-ui, sans-serif" font-size="23" text-anchor="middle">
    <text x="320" y="38">Two sperm cells, two fusions</text>
    <text x="160" y="94">Sperm n + egg n</text>
    <text x="470" y="94">Sperm n + n + n</text>
    <text x="470" y="127">Two polar nuclei contribute</text>
    <text x="160" y="209">Zygote 2n</text>
    <text x="470" y="209">Primary endosperm</text>
    <text x="470" y="240">nucleus 3n</text>
  </g>
  <path d="M160 115v61m-10-12 10 12 10-12M470 143v33m-10-12 10 12 10-12" fill="none" stroke="#285b6a" stroke-width="4"/>
</svg>
