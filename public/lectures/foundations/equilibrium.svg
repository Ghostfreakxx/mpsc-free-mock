<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Dynamic equilibrium</title><desc id="desc">Forward and reverse rates converge to the same positive value. Curves are schematic, not experimental data.</desc>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Equal rates. Continuing reactions.</text>
<path d="M85 75V285H550" fill="none" stroke="#334155" stroke-width="2"/>
<text x="26" y="170" font-size="18" transform="rotate(-90 26 170)">Reaction rate</text><text x="265" y="320" font-size="18">Time</text>
<path d="M100 90C180 125 210 180 340 182H530" fill="none" stroke="#b42343" stroke-width="4"/>
<path d="M100 280C175 230 240 185 340 182H530" fill="none" stroke="#087e8b" stroke-width="4"/>
<path d="M340 65V285" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
<text x="110" y="80" font-size="18" fill="#b42343">Forward</text><text x="110" y="260" font-size="18" fill="#087e8b">Reverse</text>
<text x="365" y="160" font-size="18">Same nonzero rate</text>
<text x="595" y="100" font-size="21" font-weight="bold">At equilibrium</text>
<text x="595" y="145" font-size="18">Forward rate = reverse rate</text><text x="595" y="180" font-size="18">Composition stays constant</text><text x="595" y="215" font-size="18">Molecules keep reacting</text><text x="595" y="250" font-size="18">Amounts need not be equal</text>
<text x="30" y="349" font-size="16" fill="#475569">Schematic closed-system approach at fixed conditions; curves are not measured data.</text></g></svg>
