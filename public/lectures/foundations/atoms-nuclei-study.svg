<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330">
  <title>A hydrogen transition from n = 3 to n = 2 emits a photon.</title>
  <rect width="900" height="330" fill="#f7f5ed"/>
  <path d="M155 75H750M155 127H750M155 235H750M460 79V115m-9-10 9 10 9-10" fill="none" stroke="#285b6a" stroke-width="5" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-size="25" fill="#1b3843">
    <text x="95" y="305">n = 3 → n = 2</text>
    <text x="340" y="305">Emission: 1.89 eV</text>
    <text x="585" y="305">Energies not to scale</text>
  </g>
</svg>
