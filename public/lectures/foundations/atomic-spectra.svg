<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Hydrogen energy levels and the n equals four to two transition</title><desc id="d">Hydrogen levels are minus thirteen point six, minus three point four, minus one point five one and minus zero point eight five electron volts. A downward transition from four to two emits a two point five five electron volt photon.</desc><rect width="900" height="360" fill="#f6faf7"/><g font-family="Arial" fill="#21392d" font-size="18"><text x="40" y="35">Hydrogen: bound energies below zero</text><path d="M100 60H620M100 80H620M100 95H620M100 136H620M100 320H620" stroke="#5687a5" stroke-width="3"/><text x="640" y="66">0 eV: continuum</text><text x="640" y="86">n = 4: -0.85 eV</text><text x="640" y="111">n = 3: -1.51 eV</text><text x="640" y="142">n = 2: -3.40 eV</text><text x="640" y="326">n = 1: -13.60 eV</text><path d="M400 80V136l-8-12m8 12 8-12" stroke="#b85837" stroke-width="4" fill="none"/><text x="120" y="195">4 → 2: photon energy 2.55 eV</text><text x="120" y="224">Wavelength approximately 486 nm</text><text x="120" y="255">Downward electronic transition: emission</text></g></svg>
