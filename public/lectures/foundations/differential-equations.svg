<title id="title">Exponential decay as a differential equation</title><desc id="desc">For N prime equals negative k N, initial amount eighty and half life three, the solution is N(t)=80 times two raised to negative t over three. It reaches forty at time three and twenty at time six, remaining positive.</desc>
