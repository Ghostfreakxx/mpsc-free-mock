<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">A resultant and an area from the same vectors</title><desc id="desc">The perpendicular vectors u=(3,0,0) and v=(0,4,0) have resultant (3,4,0) of length five. Their cross product (0,0,12) is perpendicular to the drawing plane. Its magnitude gives parallelogram area twelve and half gives triangle area six.</desc>
<rect width="900" height="540" rx="20" fill="#f5faf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20483e"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#20483e"><text x="45" y="52" font-size="27" font-weight="bold">Vector algebra: lengths and areas use different operations</text>
<rect x="150" y="110" width="225" height="300" fill="#dcece4"/>
<path d="M150 410H375 M150 410V110 M150 410L375 110" fill="none" stroke="#20483e" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M150 110H375V410" fill="none" stroke="#456f82" stroke-width="2" stroke-dasharray="6 4"/>
<text x="220" y="445" font-size="24">u=(3,0,0)</text><text x="75" y="250" font-size="24">|v|=4</text>
<text x="225" y="265" font-size="24">|u+v|=5</text><text x="500" y="200" font-size="24">Parallelogram area=12</text><text x="500" y="250" font-size="24">Triangle area=6</text><text x="500" y="320" font-size="24">u×v=(0,0,12)</text>
<text x="450" y="505" text-anchor="middle" font-size="22">The cross product points perpendicular to the xy plane.</text></g></svg>
