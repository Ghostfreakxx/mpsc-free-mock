<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Limits, continuity and differentiability answer different questions</title>
<desc id="desc">The rational quotient (x squared minus four)/(x minus two) has limit four at two but is undefined there. Absolute value is continuous at zero but its unequal one-sided slopes prevent differentiability.</desc>
<rect width="900" height="360" rx="18" fill="#f5faf7"/>
<g fill="#20483e" font-family="Arial,sans-serif">
<text x="28" y="43" font-size="25" font-weight="bold">A LIMIT, A VALUE AND A SLOPE ARE DIFFERENT DATA</text>
<rect x="24" y="66" width="412" height="220" rx="12" fill="#dcece4"/>
<text x="44" y="105" font-size="22">f(x)=(x²−4)/(x−2), x≠2</text>
<text x="44" y="152" font-size="22">For nearby x: f(x)=x+2</text>
<text x="44" y="201" font-size="24">Limit at x=2 is 4.</text>
<text x="44" y="251" font-size="19">The original f(2) is undefined.</text>
<rect x="460" y="66" width="416" height="220" rx="12" fill="#e6edf0"/>
<text x="480" y="105" font-size="24">g(x)=|x| is continuous at 0.</text>
<text x="480" y="152" font-size="22">Left derivative = −1</text>
<text x="480" y="201" font-size="22">Right derivative = +1</text>
<text x="480" y="251" font-size="19">No two-sided derivative at 0.</text>
<text x="450" y="333" text-anchor="middle" font-size="19">Differentiability implies continuity. The converse fails.</text>
</g></svg>
