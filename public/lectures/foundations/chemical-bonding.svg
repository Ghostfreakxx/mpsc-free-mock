<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Linear carbon dioxide and bent water have different dipole sums</title><desc id="d">Carbon dioxide has two equal opposite bond dipoles which cancel. Bent water has two bond dipoles whose vector sum is nonzero. Arrows use the chemical bond polarity convention toward oxygen.</desc><rect width="900" height="360" fill="#f6faf7"/><g font-family="Arial" fill="#21392d" font-size="22" text-anchor="middle"><text x="220" y="45">CO2: linear</text><text x="675" y="45">H2O: bent</text><g stroke="#427494" stroke-width="3" fill="none"><path d="M115 155H325M585 210 675 140 765 210"/><path d="M185 115H125l12-8m-12 8 12 8M255 115h60l-12-8m12 8-12 8M606 189l50-40-12 1m12-1-4 11M744 189l-50-40 12 1m-12-1 4 11" stroke="#b85837"/></g><g fill="#dcebf4" stroke="#427494" stroke-width="2"><circle cx="110" cy="155" r="24"/><circle cx="220" cy="155" r="24"/><circle cx="330" cy="155" r="24"/><circle cx="585" cy="210" r="24"/><circle cx="675" cy="140" r="24"/><circle cx="765" cy="210" r="24"/></g><text x="110" y="163">O</text><text x="220" y="163">C</text><text x="330" y="163">O</text><text x="585" y="218">H</text><text x="675" y="148">O</text><text x="765" y="218">H</text><text x="220" y="280">Net dipole = 0</text><text x="675" y="280">Net dipole ≠ 0</text><text x="450" y="329" font-size="16">Geometry schematic; arrows point toward the more electronegative atom</text></g></svg>
