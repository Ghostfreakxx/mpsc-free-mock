<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Ideal binary solution pressure versus liquid composition</title><desc id="d">For pure pressures eighty and forty kilopascals, A partial pressure rises from zero to eighty as its mole fraction increases. B partial pressure falls from forty to zero. Total pressure rises from forty to eighty. At equal liquid mole fractions, partial pressures are forty and twenty, total sixty kilopascals.</desc><rect width="900" height="360" fill="#f6faf7"/><g font-family="Arial" fill="#21392d" font-size="17"><text x="50" y="30">Ideal mixture at fixed temperature</text><path d="M90 45V300H570" fill="none" stroke="#21392d" stroke-width="2"/><text x="20" y="60">kPa</text><text x="52" y="65">80</text><text x="52" y="185">40</text><text x="60" y="305">0</text><text x="85" y="325">0</text><text x="540" y="325">1</text><text x="300" y="347">Liquid mole fraction x_A</text><path d="M90 300 550 60" stroke="#427494" stroke-width="3"/><path d="M90 180 550 300" stroke="#b85837" stroke-width="3"/><path d="M90 180 550 60" stroke="#34764e" stroke-width="4"/><path d="M320 300V120" stroke="#82938b" stroke-dasharray="5 5"/><circle cx="320" cy="120" r="5" fill="#34764e"/><text x="300" y="324">0.5</text><text x="600" y="85" fill="#34764e">Total: P_A + P_B</text><text x="600" y="122" fill="#427494">P_A = 80 x_A</text><text x="600" y="159" fill="#b85837">P_B = 40 (1 - x_A)</text><text x="600" y="220">At x_A = 0.5:</text><text x="600" y="250">P_total = 60 kPa</text><text x="600" y="280">Vapour y_A = 40/60</text><text x="600" y="310">= 2/3, not 1/2</text></g></svg>
