<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Disaccharide hydrolysis</title><desc id="desc">Sucrose gives glucose and fructose, maltose gives two glucose units, lactose gives galactose and glucose.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#18212b"/></marker></defs>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Hydrolysis reveals the constituent sugar units</text>
<g font-size="23"><text x="45" y="110">Sucrose + H2O</text><text x="475" y="110">Glucose + fructose</text><text x="45" y="195">Maltose + H2O</text><text x="475" y="195">Glucose + glucose</text><text x="45" y="280">Lactose + H2O</text><text x="475" y="280">Galactose + glucose</text></g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M265 102H425"/><path d="M265 187H425"/><path d="M265 272H425"/></g>
<text x="285" y="85" font-size="17" fill="#087e8b">Hydrolysis</text><text x="285" y="170" font-size="17" fill="#087e8b">Hydrolysis</text><text x="285" y="255" font-size="17" fill="#087e8b">Hydrolysis</text>
<text x="30" y="345" font-size="16" fill="#475569">Composition schematic, not molecular geometry. One water is consumed per disaccharide.</text></g></svg>
