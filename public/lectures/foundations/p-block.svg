<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">P-block valence map</title><desc id="desc">Groups 13 through 18 have the usual patterns ns2 np1 through ns2 np6, with helium 1s2 as the Group 18 exception.</desc>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">A valence map, not a fixed oxidation-state table</text>
<path d="M30 105H870M30 195H870" stroke="#64748b" stroke-width="2"/>
<g font-size="21" text-anchor="middle"><text x="100" y="90">Group 13</text><text x="240" y="90">Group 14</text><text x="380" y="90">Group 15</text><text x="520" y="90">Group 16</text><text x="660" y="90">Group 17</text><text x="800" y="90">Group 18</text></g>
<g font-size="21" text-anchor="middle" fill="#087e8b"><text x="100" y="155">ns2 np1</text><text x="240" y="155">ns2 np2</text><text x="380" y="155">ns2 np3</text><text x="520" y="155">ns2 np4</text><text x="660" y="155">ns2 np5</text><text x="800" y="155">ns2 np6</text></g>
<text x="40" y="245" font-size="21" fill="#b42343">Helium exception: 1s2, yet Group 18</text><text x="40" y="285" font-size="18">Group behaviour and the actual configuration must both be considered.</text>
<text x="30" y="345" font-size="16" fill="#475569">Configurations shown are usual outer-shell patterns, not universal compound charges.</text></g></svg>
