<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Oxidation versus aldol addition</title><desc id="desc">Ethanol can oxidize to ethanal then ethanoic acid. Two ethanal molecules join in aldol addition to give 3-hydroxybutanal.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#18212b"/></marker></defs>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Different reactions. Different bond changes.</text>
<text x="30" y="90" font-size="20" fill="#087e8b">Oxidation with suitable reagents</text>
<text x="45" y="140" font-size="23">CH3CH2OH</text><text x="375" y="140" font-size="23">CH3CHO</text><text x="680" y="140" font-size="23">CH3COOH</text>
<path d="M205 132H335" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M515 132H640" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="173" font-size="18">ethanol</text><text x="380" y="173" font-size="18">ethanal</text><text x="680" y="173" font-size="18">ethanoic acid</text>
<text x="30" y="235" font-size="20" fill="#b42343">Initial self-aldol addition: join two carbon skeletons</text>
<text x="45" y="280" font-size="23">2 CH3CHO</text><path d="M215 272H400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="280" font-size="23">CH3CH(OH)CH2CHO</text>
<text x="440" y="310" font-size="18">3-hydroxybutanal: 4 carbons</text>
<text x="30" y="347" font-size="16" fill="#475569">The aldol addition product retains OH. Dehydration to an alkene is a further step.</text></g></svg>
