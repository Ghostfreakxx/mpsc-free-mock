<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Balanced iron oxidation: count atoms on both sides</title><desc id="desc">Four iron atoms and three oxygen molecules produce two iron oxide formula units. Both sides contain four iron atoms and six oxygen atoms.</desc>
<rect width="900" height="360" fill="#f6faf7"/>
<g font-family="Arial, sans-serif" fill="#21392d" text-anchor="middle">
<text x="450" y="42" font-size="24">4Fe + 3O2 → 2Fe2O3</text>
<text x="220" y="87" font-size="20">Reactants</text><text x="680" y="87" font-size="20">Products</text>
<g fill="#578ba9" stroke="#21392d" stroke-width="2"><circle cx="130" cy="130" r="16"/><circle cx="185" cy="130" r="16"/><circle cx="240" cy="130" r="16"/><circle cx="295" cy="130" r="16"/><circle cx="590" cy="130" r="16"/><circle cx="635" cy="130" r="16"/><circle cx="720" cy="130" r="16"/><circle cx="765" cy="130" r="16"/></g>
<g fill="#d47753" stroke="#713c2b" stroke-width="2"><circle cx="110" cy="200" r="13"/><circle cx="136" cy="200" r="13"/><circle cx="205" cy="200" r="13"/><circle cx="231" cy="200" r="13"/><circle cx="300" cy="200" r="13"/><circle cx="326" cy="200" r="13"/><circle cx="578" cy="200" r="13"/><circle cx="613" cy="200" r="13"/><circle cx="648" cy="200" r="13"/><circle cx="708" cy="200" r="13"/><circle cx="743" cy="200" r="13"/><circle cx="778" cy="200" r="13"/></g>
<text x="450" y="171" font-size="40">→</text>
<text x="220" y="263" font-size="20">4 Fe atoms · 6 O atoms</text><text x="680" y="263" font-size="20">4 Fe atoms · 6 O atoms</text>
<text x="450" y="313" font-size="17">Atom-count schematic, not molecular geometry: blue Fe, orange O</text>
</g></svg>
