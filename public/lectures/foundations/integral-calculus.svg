<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Area between a line and a parabola</title><desc id="desc">The curves y=x and y=x squared meet at zero and one. The line is above the parabola between these inputs. Integrating upper minus lower gives one sixth square units.</desc>
<rect width="900" height="540" rx="20" fill="#f5faf7"/>
<g font-family="Arial,sans-serif" fill="#20483e"><text x="45" y="52" font-size="27" font-weight="bold">Integral calculus: specify the bounded region</text>
<path d="M75 415H640 M100 110V440" stroke="#20483e" stroke-width="2"/>
<path d="M100 415L550 145Q325 415 100 415" fill="#dcece4"/>
<path d="M100 415L550 145" stroke="#20483e" stroke-width="4"/><path d="M100 415Q325 415 550 145" fill="none" stroke="#456f82" stroke-width="4"/>
<text x="260" y="250" font-size="26">y=x</text><text x="410" y="365" font-size="26">y=x²</text><text x="88" y="450" font-size="22">0</text><text x="542" y="450" font-size="22">1</text>
<text x="650" y="215" font-size="22">Intersections:</text><text x="650" y="250" font-size="22">x²=x ⇒ x=0,1</text><text x="650" y="305" font-size="22">Upper − lower</text>
<text x="450" y="503" text-anchor="middle" font-size="27">Area = ∫₀¹(x−x²)dx = 1/2−1/3 = 1/6</text></g></svg>
