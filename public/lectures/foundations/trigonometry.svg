<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Unit-circle signs and principal inverse ranges</title>
<desc id="desc">The angle two pi over three lies in quadrant two, with cosine negative one half and sine square root of three over two. Arcsine of sine five pi over six returns pi over six because of its restricted principal range.</desc>
<rect width="900" height="360" rx="18" fill="#f5faf7"/>
<g fill="#20483e" font-family="Arial,sans-serif">
<text x="28" y="42" font-size="25" font-weight="bold">AN INVERSE VALUE MUST LIE IN ITS PRINCIPAL RANGE</text>
<path d="M45 195H365 M205 72V310" stroke="#20483e" stroke-width="2"/>
<circle cx="205" cy="195" r="88" fill="none" stroke="#20483e" stroke-width="2"/>
<path d="M205 195L161 118.79" stroke="#20483e" stroke-width="3"/><circle cx="161" cy="118.79" r="5"/>
<text x="53" y="89" font-size="20">θ=2π/3</text><text x="47" y="333" font-size="18">(cosθ,sinθ) = (−½,√3/2)</text>
<rect x="400" y="70" width="475" height="225" rx="12" fill="#dcece4"/>
<text x="422" y="112" font-size="22">arcsin: [−π/2,π/2]</text>
<text x="422" y="157" font-size="22">arccos: [0,π]</text>
<text x="422" y="202" font-size="22">arctan: (−π/2,π/2)</text>
<text x="422" y="256" font-size="22">arcsin(sin5π/6) = π/6</text>
<text x="450" y="338" font-size="17">Inverse functions are distinct from reciprocals.</text>
</g></svg>
