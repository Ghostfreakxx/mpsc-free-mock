<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Isoelectronic ions contract as nuclear charge increases</title><desc id="d">Oxygen two minus, fluoride, sodium plus and magnesium two plus each have ten electrons. Their radii decrease as proton number rises from eight to twelve. Circles illustrate ordering and are not measured radii.</desc><rect width="900" height="360" fill="#f6faf7"/><g font-family="Arial" fill="#21392d" text-anchor="middle" font-size="20"><text x="450" y="40">Same 10 electrons; stronger nuclear attraction</text><g fill="#dcebf4" stroke="#427494" stroke-width="3"><circle cx="135" cy="158" r="65"/><circle cx="345" cy="158" r="54"/><circle cx="555" cy="158" r="40"/><circle cx="765" cy="158" r="33"/></g><text x="135" y="165">O2-</text><text x="345" y="165">F-</text><text x="555" y="165">Na+</text><text x="765" y="165">Mg2+</text><text x="135" y="255">Z = 8</text><text x="345" y="255">Z = 9</text><text x="555" y="255">Z = 11</text><text x="765" y="255">Z = 12</text><text x="450" y="300">Radius: O2- &gt; F- &gt; Na+ &gt; Mg2+</text><text x="450" y="334" font-size="16">Ordering schematic: circles are not quantitative radius data</text></g></svg>
