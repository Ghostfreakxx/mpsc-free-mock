<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
  <title>Active and passive immunity comparison</title>
  <rect width="640" height="280" fill="#f7f5ed"/>
  <path d="M320 30V247M166 110v50m-8-9 8 9 8-9M474 110v50m-8-9 8 9 8-9" stroke="#285b6a" stroke-width="3" fill="none"/>
  <g fill="#1b3843" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
    <text x="166" y="52">Active immunity</text><text x="474" y="52">Passive immunity</text>
    <text x="166" y="91">Antigen exposure</text><text x="474" y="91">Transferred antibodies</text>
    <text x="166" y="191">Recipient response</text><text x="474" y="191">Temporary protection</text>
    <text x="166" y="223">Memory can develop</text><text x="474" y="223">Transfer alone gives no memory</text>
  </g>
</svg>
