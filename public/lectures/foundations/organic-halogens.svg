<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Bromoethane substitution and elimination</title><desc id="desc">Aqueous hydroxide favours ethanol formation for this primary substrate; hot alcoholic KOH favours ethene in standard textbook conditions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#18212b"/></marker></defs>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Conditions help select the competing pathway</text>
<text x="40" y="175" font-size="24">CH3-CH2-Br</text><text x="70" y="210" font-size="19">bromoethane</text>
<path d="M225 160L420 105H535" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M225 190L420 255H535" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="80" font-size="18" fill="#087e8b">Aqueous hydroxide</text><text x="280" y="300" font-size="18" fill="#b42343">Hot alcoholic KOH</text>
<text x="565" y="110" font-size="24">CH3-CH2-OH</text><text x="565" y="145" font-size="19">ethanol: substitution</text>
<text x="565" y="255" font-size="24">CH2=CH2</text><text x="565" y="290" font-size="19">ethene: elimination</text>
<text x="30" y="345" font-size="16" fill="#475569">Textbook trends for this substrate, not universal switches for every halide and reagent.</text></g></svg>
