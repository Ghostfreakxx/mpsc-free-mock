<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Electron balance in an acidic permanganate titration</title><desc id="desc">One permanganate accepts five electrons while five iron(II) ions supply one each. The mole ratio is one to five.</desc>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Balance electrons before calculating volumes</text>
<text x="40" y="105" font-size="23" fill="#087e8b">MnO4- -&gt; Mn2+</text><text x="450" y="105" font-size="23" fill="#b42343">5 Fe2+ -&gt; 5 Fe3+</text>
<text x="40" y="150" font-size="20">1 ion accepts 5 electrons</text><text x="450" y="150" font-size="20">5 ions each supply 1 electron</text>
<path d="M30 185H870" stroke="#64748b" stroke-width="2"/>
<text x="160" y="240" font-size="25" font-weight="bold">Mole ratio MnO4- : Fe2+ = 1 : 5</text>
<text x="100" y="290" font-size="19">Specified acidic medium; Mn2+ is the reduction product.</text>
<text x="30" y="345" font-size="16" fill="#475569">Half-reaction summary, not a complete atom-balanced equation or a laboratory procedure.</text></g></svg>
