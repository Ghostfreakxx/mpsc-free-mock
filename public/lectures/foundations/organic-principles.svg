<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Cis and trans but-2-ene</title><desc id="desc">Each double-bonded carbon has H and CH3. Cis has both methyl groups on one side; trans has them on opposite sides.</desc>
<rect width="900" height="360" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18212b"><text x="30" y="35" font-size="24" font-weight="bold">Restricted rotation makes two arrangements possible</text>
<text x="175" y="85" font-size="22">cis-but-2-ene</text><text x="590" y="85" font-size="22">trans-but-2-ene</text>
<g stroke="#334155" stroke-width="3"><path d="M205 177H275M205 187H275M177 169L145 130M177 197L145 240M302 169L335 130M302 197L335 240M625 177H695M625 187H695M597 169L565 130M597 197L565 240M722 169L755 130M722 197L755 240"/></g>
<g font-size="24"><text x="180" y="192">C</text><text x="280" y="192">C</text><text x="600" y="192">C</text><text x="700" y="192">C</text>
<g fill="#087e8b"><text x="110" y="120">CH3</text><text x="315" y="120">CH3</text><text x="530" y="120">CH3</text><text x="735" y="265">CH3</text></g>
<text x="125" y="265">H</text><text x="325" y="265">H</text><text x="545" y="265">H</text><text x="745" y="120">H</text></g>
<text x="150" y="305" font-size="18">Methyl groups: same side</text><text x="560" y="305" font-size="18">Methyl groups: opposite sides</text>
<text x="30" y="347" font-size="16" fill="#475569">Connectivity is unchanged. Drawings are schematic projections, not measured bond angles.</text></g></svg>
