<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Chemistry first-law energy balance</title><desc id="d">A gas absorbs five hundred joules of heat and does two hundred joules of expansion work. Work on the system is minus two hundred joules, leaving an internal energy increase of three hundred joules.</desc><rect width="900" height="360" fill="#f6faf7"/><g font-family="Arial" fill="#21392d" text-anchor="middle"><text x="450" y="40" font-size="24">Chemistry convention: Delta U = q + w</text><rect x="300" y="90" width="300" height="155" rx="6" fill="#dcebf4" stroke="#427494" stroke-width="2"/><text x="450" y="135" font-size="24">Closed gas system</text><text x="450" y="180" font-size="23">Delta U = +300 J</text><text x="450" y="218" font-size="18">Expansion: Delta V &gt; 0</text><path d="M80 155H280l-14-9m14 9-14 9" fill="none" stroke="#34764e" stroke-width="4"/><path d="M620 155H825l-14-9m14 9-14 9" fill="none" stroke="#b85837" stroke-width="4"/><text x="175" y="120" font-size="19">Heat entering</text><text x="175" y="195" font-size="20">q = +500 J</text><text x="725" y="120" font-size="18">Work done by gas</text><text x="725" y="195" font-size="20">w_on = -200 J</text><text x="450" y="290" font-size="20">500 J - 200 J = 300 J</text><text x="450" y="329" font-size="17">Work on the system is positive; work by it is negative</text></g></svg>
