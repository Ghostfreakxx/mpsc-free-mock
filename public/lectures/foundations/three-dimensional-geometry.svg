<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">A common perpendicular of two skew lines</title><desc id="desc">This schematic projection shows L1=(t,0,0) and L2=(s,2,s+1). Closest parameters are t=s=negative one. The points P=(-1,0,0) and Q=(-1,2,0) are joined by common perpendicular r=(-1,u,0), with shortest distance two. Projected angles and lengths are not space measurements.</desc>
<rect width="900" height="540" rx="20" fill="#f5faf7"/>
<g font-family="Arial,sans-serif" fill="#20483e"><text x="45" y="52" font-size="27" font-weight="bold">3D geometry: shortest distance and its line</text>
<path d="M70 400H570 M80 300L500 90" fill="none" stroke="#20483e" stroke-width="4"/>
<path d="M220 230V400" stroke="#456f82" stroke-width="4" stroke-dasharray="8 5"/>
<circle cx="220" cy="230" r="6"/><circle cx="220" cy="400" r="6"/>
<text x="370" y="175" font-size="22">L₂=(s,2,s+1)</text><text x="390" y="385" font-size="22">L₁=(t,0,0)</text>
<text x="240" y="233" font-size="22">Q=(−1,2,0)</text><text x="240" y="433" font-size="22">P=(−1,0,0)</text>
<text x="240" y="323" font-size="25">PQ=2</text><text x="620" y="255" font-size="22">r=(−1,u,0)</text><text x="620" y="295" font-size="22">Direction (0,1,0)</text><text x="620" y="335" font-size="22">Perpendicular to both</text>
<text x="450" y="505" text-anchor="middle" font-size="22">Schematic projection: use coordinates and dot products to verify.</text></g></svg>
